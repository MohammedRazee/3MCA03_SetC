<!DOCTYPE html>
<!-- DO NOT EDIT THIS FILE. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academy Course Catalogue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Academy Course Catalogue</h1>
    <p>CA Lab Exam &middot; Section 3MCA03 &middot; Set C</p>
  </header>

  <main>
    <div class="controls">
      <section class="panel">
        <h2>Quick views</h2>
        <div class="actions">
          <button id="show-all" type="button">Show All Courses</button>
          <button id="top-three" type="button">3 Costliest Courses</button>
        </div>
      </section>

      <section class="panel">
        <h2>Search by category</h2>
        <form id="search-form" class="inline">
          <select name="category" required>
            <option value="">Choose a category...</option>
            <option value="Programming">Programming</option>
            <option value="Design">Design</option>
            <option value="Business">Business</option>
          </select>
          <button type="submit">Search</button>
        </form>
      </section>

      <section class="panel">
        <h2>Filter</h2>
        <form id="filter-form" class="inline">
          <label>Weeks less than
            <input type="number" name="maxWeeks" step="1" required>
          </label>
          <button type="submit">Filter</button>
        </form>
      </section>

      <section class="panel">
        <h2>Add Course</h2>
        <form id="add-form" class="stack">
        <label>Title
          <input type="text" name="title" required>
        </label>
        <label>Category
          <select name="category" required>
            <option value="">Choose...</option>
            <option value="Programming">Programming</option>
            <option value="Design">Design</option>
            <option value="Business">Business</option>
          </select>
        </label>
        <label>Weeks
          <input type="number" name="weeks" step="1" required>
        </label>
        <label>Fee
          <input type="number" name="fee" step="1" required>
        </label>
          <button type="submit">Add Course</button>
        </form>
        <p id="add-status" class="status"></p>
      </section>
    </div>

    <section class="panel results">
      <h2 id="result-title">Results</h2>
      <div id="result"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
